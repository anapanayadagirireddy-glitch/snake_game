<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#18342d">
  <title>snakegame2.o — Verdant Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar"><a class="brand" href="#" aria-label="snakegame2.o home"><span class="brand-mark">S</span><span>snakegame2.o</span></a><div class="score-card"><span>Best</span><strong id="high-score">0</strong></div></header>
    <section class="game-card" aria-label="Snake game">
      <div class="game-heading"><div><p class="eyebrow">A mindful arcade classic</p><h1>Snake <em>in bloom.</em></h1></div><div class="score-card current-score"><span>Score</span><strong id="score">0</strong></div></div>
      <div class="board-frame"><canvas id="board" width="600" height="600" aria-label="Snake game board"></canvas><div class="game-overlay" id="overlay"><div class="overlay-content"><span class="leaf">✦</span><h2 id="overlay-title">Ready to wander?</h2><p id="overlay-text">Gather the golden fruit and let your garden grow.</p><button id="start-button" type="button">Begin game <span>→</span></button></div></div></div>
      <div class="game-footer"><p class="hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> to move &nbsp;·&nbsp; <kbd>Space</kbd> to pause</p><button class="quiet-button" id="pause-button" type="button">Pause</button></div>
    </section>
    <section class="mobile-controls" aria-label="Touch controls"><button data-direction="up" aria-label="Move up">↑</button><div><button data-direction="left" aria-label="Move left">←</button><button data-direction="down" aria-label="Move down">↓</button><button data-direction="right" aria-label="Move right">→</button></div></section>
    <footer>Made for unhurried moments.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
